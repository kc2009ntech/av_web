    <!-- Navbar Burger Toggle Script -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const $navbarBurgers = Array.prototype.slice.call(
          document.querySelectorAll(".navbar-burger"),
          0,
        );
        $navbarBurgers.forEach((el) => {
          el.addEventListener("click", () => {
            const target = el.dataset.target;
            const $target = document.getElementById(target);
            el.classList.toggle("is-active");
            $target.classList.toggle("is-active");
          });
        });
      });
    </script>

    <!-- Internal Search / Redirect Script -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const searchInput = document.getElementById("siteSearchInput");
        const searchBtn = document.getElementById("siteSearchBtn");

        function handleInternalSearch() {
          let query = searchInput.value.trim().toLowerCase();
          if (!query) return;

          // Map keywords or phrases to your local files
          if (query.includes("news") || query.includes("latest")) {
            window.location.href = "latest_news.html";
          } else if (query.includes("airbus")) {
            window.location.href = "airbus.html";
          } else if (query.includes("boeing")) {
            window.location.href = "boeing.html";
          } else if (query.includes("airport")) {
            window.location.href = "airports.html";
          } else if (
            query.includes("sustainability") ||
            query.includes("green")
          ) {
            window.location.href = "sustainability.html";
          } else if (query.includes("contact") || query.includes("report")) {
            window.location.href = "report.html";
          } else {
            window.location.href = "404.html";
          }
        }
        // Trigger on button click
        searchBtn.addEventListener("click", handleInternalSearch);

        // Trigger on "Enter" key press
        searchInput.addEventListener("keypress", function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            handleInternalSearch();
          }
        });
      });
    </script>
