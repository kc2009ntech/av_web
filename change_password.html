    <!-- Main Form Container -->
      <div class="section">
        <div class="container" style="max-width: 450px">
          <div class="box">
            <h1 class="title has-text-centered">Change Password</h1>

            <form id="password-form">
              <!-- Current Password Input -->
              <div class="field">
                <label class="label">Current Password</label>
                <div class="control">
                  <input
                    id="current-password"
                    class="input"
                    type="password"
                    placeholder="Enter current password"
                    required
                  />
                </div>
              </div>

              <!-- New Password Input -->
              <div class="field">
                <label class="label">New Password</label>
                <div class="control">
                  <input
                    id="new-password"
                    class="input"
                    type="password"
                    placeholder="Minimum 6 characters"
                    required
                    minlength="6"
                  />
                </div>
              </div>

              <!-- Confirm New Password Input -->
              <div class="field">
                <label class="label">Confirm New Password</label>
                <div class="control">
                  <input
                    id="confirm-password"
                    class="input"
                    type="password"
                    placeholder="Re-enter new password"
                    required
                  />
                </div>
              </div>

              <!-- Status Messages -->
              <p
                id="error-message"
                class="has-text-danger mt-2"
                style="display: none"
              ></p>
              <p
                id="success-message"
                class="has-text-success mt-2"
                style="display: none"
              ></p>

              <div class="field mt-4">
                <button
                  type="submit"
                  id="update-btn"
                  class="button is-primary is-fullwidth"
                >
                  Update Password
                </button>
              </div>
            </form>

            <!-- White Back Button -->
            <div class="has-text-centered mt-4">
              <a
                href="dashboard.html"
                class="button is-white is-fullwidth"
                style="border: 1px solid #dbdbdb"
              >
                Back to Dashboard
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        signOut,
        onAuthStateChanged,
        updatePassword,
        EmailAuthProvider,
        reauthenticateWithCredential,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyChg8nk4jHsziv9PfIKwC_kbg8UM4E4-MM",
        authDomain: "newwebsite-7486f.firebaseapp.com",
        projectId: "newwebsite-7486f",
        storageBucket: "newwebsite-7486f.firebasestorage.app",
        messagingSenderId: "477829357478",
        appId: "1:477829357478:web:b17e366956c811991db967",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const protectedContent = document.getElementById("protected-content");
      const passwordForm = document.getElementById("password-form");
      const currentPasswordInput = document.getElementById("current-password");
      const newPasswordInput = document.getElementById("new-password");
      const confirmPasswordInput = document.getElementById("confirm-password");
      const errorMessage = document.getElementById("error-message");
      const successMessage = document.getElementById("success-message");
      const updateBtn = document.getElementById("update-btn");

      // Reload if user navigates via browser history
      window.addEventListener("pageshow", (event) => {
        if (
          event.persisted ||
          (performance.navigation && performance.navigation.type === 2)
        ) {
          window.location.reload();
        }
      });

      // Guard Route: Verify authentication
      onAuthStateChanged(auth, (user) => {
        if (user) {
          protectedContent.style.display = "block";
        } else {
          window.location.replace("sign_in.html");
        }
      });

      // Handle Password Change Form
      passwordForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const currentPassword = currentPasswordInput.value;
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        // Reset display messages
        errorMessage.style.display = "none";
        successMessage.style.display = "none";

        // Validate password confirmation
        if (newPassword !== confirmPassword) {
          errorMessage.textContent = "New passwords do not match.";
          errorMessage.style.display = "block";
          return;
        }

        updateBtn.classList.add("is-loading");

        try {
          const user = auth.currentUser;

          if (user) {
            // 1. Re-authenticate user with their current password
            const credential = EmailAuthProvider.credential(
              user.email,
              currentPassword,
            );
            await reauthenticateWithCredential(user, credential);

            // 2. Update to the new password
            await updatePassword(user, newPassword);

            updateBtn.classList.remove("is-loading");
            successMessage.textContent = "Password updated successfully!";
            successMessage.style.display = "block";

            passwordForm.reset();
          }
        } catch (error) {
          updateBtn.classList.remove("is-loading");
          console.error("Password Update Error:", error);

          if (
            error.code === "auth/wrong-password" ||
            error.code === "auth/invalid-credential"
          ) {
            errorMessage.textContent = "Incorrect current password.";
          } else {
            errorMessage.textContent =
              "Failed to update password. Please try again.";
          }
          errorMessage.style.display = "block";
        }
      });

      // Handle Logout
      const logoutBtn = document.getElementById("logout-btn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          try {
            await signOut(auth);
            window.location.replace("sign_in.html");
          } catch (err) {
            console.error("Logout error:", err);
          }
        });
      }
    </script>
