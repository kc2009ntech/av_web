     <script>
      document.addEventListener("DOMContentLoaded", () => {
        // 1. Mobile Burger Menu Toggle
        const $navbarBurgers = Array.prototype.slice.call(
          document.querySelectorAll(".navbar-burger"),
          0,
        );
        $navbarBurgers.forEach((el) => {
          el.addEventListener("click", () => {
            const target = el.dataset.target;
            const $target = document.getElementById(target);
            el.classList.toggle("is-active");
            if ($target) {
              $target.classList.toggle("is-active");
            }
          });
        });

        // 2. Tab Active State Highlighter & Instant Click Response
        const currentPath = window.location.pathname.split("/").pop();
        const tabItems = document.querySelectorAll(".tabs ul li");

        tabItems.forEach((li) => {
          const link = li.querySelector("a");
          if (link) {
            const href = link.getAttribute("href");

            // Highlight based on current URL when page loads
            if (href === currentPath) {
              li.classList.add("is-active");
            } else {
              li.classList.remove("is-active");
            }

            // Instantly highlight when clicked
            link.addEventListener("click", () => {
              tabItems.forEach((item) => item.classList.remove("is-active"));
              li.classList.add("is-active");
            });
          }
        });
      });
    </script>

    <!-- FIREBASE AUTHENTICATION SCRIPT -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        signOut,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyChg8nk4jHsziv9PfIKwC_kbg8UM4E4-MM",
        authDomain: "newwebsite-7486f.firebaseapp.com",
        projectId: "newwebsite-7486f",
        storageBucket: "newwebsite-7486f.firebasestorage.app",
        messagingSenderId: "477829357478",
        appId: "1:477829357478:web:b17e366956c811991db967",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const protectedContent = document.getElementById("protected-content");

      // Reload if user navigates via browser back/forward buttons
      window.addEventListener("pageshow", (event) => {
        if (
          event.persisted ||
          (performance.navigation && performance.navigation.type === 2)
        ) {
          window.location.reload();
        }
      });

      // Guard Route: Check if logged in
      onAuthStateChanged(auth, (user) => {
        if (user) {
          if (protectedContent) {
            protectedContent.style.display = "block";
          }
        } else {
          window.location.replace("sign_in.html");
        }
      });

      // Logout handler
      const logoutBtn = document.getElementById("logout-btn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          try {
            await signOut(auth);
            window.location.replace("dashboard.html");
          } catch (err) {
            console.error("Logout error:", err);
          }
        });
      }
    </script>
