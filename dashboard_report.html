    <!-- Contact Form Section -->
    <section class="section">
      <div class="container" style="max-width: 500px">
        <div class="box">
          <h1 class="title has-text-centered">Contact us</h1>

          <form>
            <!-- Name Field -->
            <div class="field">
              <label class="label">Name</label>
              <div class="control">
                <input class="input" type="text" placeholder="Your name" />
              </div>
            </div>

            <!-- Username Field -->
            <div class="field">
              <label class="label">Username</label>
              <div class="control has-icons-left has-icons-right">
                <input class="input" type="text" placeholder="Username" />
                <span class="icon is-small is-left">
                  <i class="fas fa-user"></i>
                </span>
                <span class="icon is-small is-right">
                  <i class="fas fa-check"></i>
                </span>
              </div>
            </div>

            <!-- Email Field -->
            <div class="field">
              <label class="label">Email</label>
              <div class="control has-icons-left has-icons-right">
                <input class="input" type="email" placeholder="Email input" />
                <span class="icon is-small is-left">
                  <i class="fas fa-envelope"></i>
                </span>
                <span class="icon is-small is-right">
                  <i class="fas fa-exclamation-triangle"></i>
                </span>
              </div>
            </div>

            <!-- Subject Dropdown -->
            <div class="field">
              <label class="label">Subject</label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select>
                    <option>Select dropdown</option>
                    <option>Support inquiry</option>
                    <option>General question</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Message Textarea -->
            <div class="field">
              <label class="label">Message</label>
              <div class="control">
                <textarea
                  class="textarea"
                  placeholder="Type your message here..."
                ></textarea>
              </div>
            </div>

            <!-- Terms Checkbox -->
            <div class="field">
              <div class="control">
                <label class="checkbox">
                  <input type="checkbox" />
                  I agree to the <a href="#">terms and conditions</a>
                </label>
              </div>
            </div>

            <!-- Radio Options -->
            <div class="field">
              <div class="control">
                <label class="radio">
                  <input type="radio" name="question" />
                  Yes
                </label>
                <label class="radio">
                  <input type="radio" name="question" />
                  No
                </label>
              </div>
            </div>

            <!-- Buttons -->
            <div class="field is-grouped">
              <div class="control">
                <button type="submit" class="button is-link">Submit</button>
              </div>
              <div class="control">
                <button type="reset" class="button is-link is-light">
                  Cancel
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </section>

    <div id="protected-content" style="display: none; padding: 2rem">
      <!-- Page Content Goes Here -->
    </div>

    <!-- MOBILE BURGER MENU TOGGLE SCRIPT -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const $navbarBurgers = Array.prototype.slice.call(
          document.querySelectorAll(".navbar-burger"),
          0,
        );

        if ($navbarBurgers.length > 0) {
          $navbarBurgers.forEach((el) => {
            el.addEventListener("click", () => {
              const target = el.dataset.target;
              const $target = document.getElementById(target);

              el.classList.toggle("is-active");
              if ($target) {
                $target.classList.toggle("is-active");
              }
            });
          });
        }
      });
    </script>

    <!-- FIREBASE AUTHENTICATION SCRIPT -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        signOut,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyChg8nk4jHsziv9PfIKwC_kbg8UM4E4-MM",
        authDomain: "newwebsite-7486f.firebaseapp.com",
        projectId: "newwebsite-7486f",
        storageBucket: "newwebsite-7486f.firebasestorage.app",
        messagingSenderId: "477829357478",
        appId: "1:477829357478:web:b17e366956c811991db967",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const protectedContent = document.getElementById("protected-content");

      // Reload if user navigates via browser back/forward buttons
      window.addEventListener("pageshow", (event) => {
        if (
          event.persisted ||
          (performance.navigation && performance.navigation.type === 2)
        ) {
          window.location.reload();
        }
      });

      // Guard Route: Check if logged in
      onAuthStateChanged(auth, (user) => {
        if (user) {
          if (protectedContent) {
            protectedContent.style.display = "block";
          }
        } else {
          window.location.replace("sign_in.html");
        }
      });

      // Logout handler
      const logoutBtn = document.getElementById("logout-btn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          try {
            await signOut(auth);
            window.location.replace("dashboard_home.html");
          } catch (err) {
            console.error("Logout error:", err);
          }
        });
      }
    </script>
