<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AeroLover - Contact Us</title>

    <!-- 1. Bulma CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />

    <!-- 2. Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- 3. Your Custom CSS (Must be LAST) -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <!-- 👇 PUT YOUR LOGO TAG RIGHT HERE 👇 -->
        <a class="navbar-item" href="index.html">
          <img
            src="images/image.png"
            alt="AeroLover Logo"
            style="max-height: 3.8rem"
          />
        </a>
        <!-- 👆 --------------------------------- 👆 -->

        <!-- Mobile Burger Toggle Button -->
        <a
          role="button"
          class="navbar-burger"
          aria-label="menu"
          aria-expanded="false"
          data-target="navbarBasicExample"
        >
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>

      <div id="navbarBasicExample" class="navbar-menu">
        <div class="navbar-start">
          <div class="navbar-item">
              <a class="navbar-item" href="index.html">
                <span>Home</span>
              </a>
              <a class="button is-ghost" href="latest_news.html">
                <span>Latest News</span>
              </a>
               <a class="button is-ghost" href="airbus.html">
                <span>Airbus</span>
              </a>
              <a class="button is-ghost" href="boeing.html">
                <span>Boeing</span>
              </a>
              <a class="button is-ghost" href="airports.html">
                <span>Airports</span>
              </a>
              <a class="button is-ghost" href="sustainability.html">
                <span>Sustainability</span>
              </a>
              
              <a class="button is-ghost" href="report.html">
                <span>Contact us</span>
              </a>
            </div>
          </div>
        </div>

        <div class="navbar-end">
          <div class="navbar-item">
            <div class="buttons">
              <a class="button is-primary" href="sign_up.html">
                <span class="icon">
                  <i class="fa-solid fa-user-plus"></i>
                </span>
                <span><strong>Sign up</strong></span>
              </a>
              <a class="button is-light" href="sign_in.html">
                <span class="icon">
                  <i class="fa-solid fa-right-to-bracket"></i>
                </span>
                <span>Log in</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>
    <section class="hero is-link">
      <div class="section hero-body">
        <p class="title">Welcome back!</p>
        <p class="subtitle">Your personal aviation companion</p>
      </div>
    </section>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const $navbarBurgers = Array.prototype.slice.call(
          document.querySelectorAll(".navbar-burger"),
          0,
        );
        $navbarBurgers.forEach((el) => {
          el.addEventListener("click", () => {
            const target = el.dataset.target;
            const $target = document.getElementById(target);
            el.classList.toggle("is-active");
            $target.classList.toggle("is-active");
          });
        });
      });
    </script>
  </body>
</html>
