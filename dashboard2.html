<!-- MOBILE BURGER MENU TOGGLE SCRIPT -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Get all "navbar-burger" elements
        const $navbarBurgers = Array.prototype.slice.call(
          document.querySelectorAll(".navbar-burger"),
          0,
        );

        // Add a click event on each of them
        if ($navbarBurgers.length > 0) {
          $navbarBurgers.forEach((el) => {
            el.addEventListener("click", () => {
              // Get the target from the "data-target" attribute
              const target = el.dataset.target;
              const $target = document.getElementById(target);

              // Toggle the "is-active" class on both the "navbar-burger" and the "navbar-menu"
              el.classList.toggle("is-active");
              if ($target) {
                $target.classList.toggle("is-active");
              }
            });
          });
        }
      });
    </script>

    <!-- FIREBASE AUTHENTICATION SCRIPT -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        signOut,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyChg8nk4jHsziv9PfIKwC_kbg8UM4E4-MM",
        authDomain: "newwebsite-7486f.firebaseapp.com",
        projectId: "newwebsite-7486f",
        storageBucket: "newwebsite-7486f.firebasestorage.app",
        messagingSenderId: "477829357478",
        appId: "1:477829357478:web:b17e366956c811991db967",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const protectedContent = document.getElementById("protected-content");

      // Reload if user navigates via browser back/forward buttons
      window.addEventListener("pageshow", (event) => {
        if (
          event.persisted ||
          (performance.navigation && performance.navigation.type === 2)
        ) {
          window.location.reload();
        }
      });

      // Guard Route: Check if logged in
      onAuthStateChanged(auth, (user) => {
        if (user) {
          if (protectedContent) {
            protectedContent.style.display = "block";
          }
        } else {
          window.location.replace("sign_in.html");
        }
      });

      // Logout handler
      const logoutBtn = document.getElementById("logout-btn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          try {
            await signOut(auth);
            window.location.replace("dashboard.html");
          } catch (err) {
            console.error("Logout error:", err);
          }
        });
      }
    </script>
